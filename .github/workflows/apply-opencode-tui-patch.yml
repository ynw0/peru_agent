name: Apply OpenCode-style TUI patch

on:
  push:
    branches:
      - agent/native-terminal-history
    paths:
      - .peru-agent-opencode-patch/**
      - .github/workflows/apply-opencode-tui-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .peru-agent-opencode-patch/[0-9][0-9][0-9] \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/opencode-tui.patch
          echo "efe6d51d8b066dd9b3483a8d311e9d8fd6dfa14c22cdfa2124a99f4d44bb5cd2  /tmp/opencode-tui.patch" \
            | sha256sum --check --strict
          git restore --source=f40ccfd437ab71e8171aba5946a19c4c8dfe8b1f --staged --worktree .
          git apply --check /tmp/opencode-tui.patch
          git apply --index /tmp/opencode-tui.patch
          git diff --cached --check
          git config user.name "Peru Agent"
          git config user.email "peru-agent@users.noreply.github.com"
          git commit -m "restore OpenCode-style TUI mouse interaction"
          git push origin "HEAD:${GITHUB_REF_NAME}"
